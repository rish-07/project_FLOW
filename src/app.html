<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2ECDD" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15130F" />

    <!-- PWA: installable, full-screen standalone. %sveltekit.assets% keeps every
         path base-correct on Cloudflare Pages subdomains. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookings" />

    <!-- Fonts: Fraunces (display) + Inter (body) + JetBrains Mono (data). design-system.md §2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-paint theme: set `.dark` before first paint so there is no flash.
         Mirrors src/lib/stores/theme.svelte.ts — keep the key + logic in sync:
         a stored 'dark'/'light' is forced; 'system' or absent follows the OS. -->
    <script>
      try {
        var p = localStorage.getItem('theme-pref');
        var dark =
          p === 'dark' ||
          ((p === null || p === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
